spring.application.name=aws-week2-practice

aws.s3.client.region=us-east-1
aws.s3.client.access-key=${AWS_ACCESS_KEY_ID}
aws.s3.client.secret-key=${AWS_SECRET_ACCESS_KEY}


aws.s3.server.url=${S3_BUCKET_URL}


app.local.directory=${LOCAL_DIRECTORY}

spring.docker.compose.enabled=false

spring.datasource.url=jdbc:postgresql://localhost:5432
